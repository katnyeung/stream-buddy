# Stream Buddy - Nginx Configuration
# Add this inside the server {} block in /etc/nginx/sites-available/resumebuddy.cv

# Main application proxy
location /stream-buddy/ {
    proxy_pass http://127.0.0.1:8088/;
    proxy_http_version 1.1;

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Extended timeout for AI/TTS/STT operations
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    proxy_connect_timeout 300;

    # Disable buffering for real-time streaming
    proxy_buffering off;
}

# WebSocket endpoint (separate block for long-lived connections)
location /stream-buddy/ws/ {
    proxy_pass http://127.0.0.1:8088/ws/;
    proxy_http_version 1.1;

    # WebSocket upgrade headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long timeout for WebSocket (1 hour)
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;

    # Disable buffering
    proxy_buffering off;
}
