<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Buddy - Script Outline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 15px 20px;
            background: #16213e;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1rem;
            color: #00d4ff;
            font-weight: 600;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #888;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.connected {
            background: #2ed573;
        }

        .status-dot.waiting {
            background: #ffa502;
            animation: pulse 1.5s infinite;
        }

        .status-dot.error {
            background: #ff4757;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .sections-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .sections-list {
            list-style: none;
        }

        .section-item {
            padding: 15px 18px;
            margin-bottom: 10px;
            border-radius: 10px;
            background: rgba(30, 40, 60, 0.6);
            border-left: 4px solid #444;
            transition: all 0.3s ease;
        }

        .section-item.loading {
            background: transparent;
            border: none;
            color: #888;
            font-style: italic;
            text-align: center;
            padding: 40px;
        }

        .section-item.current {
            background: rgba(255, 200, 50, 0.15);
            border-left-color: #ffc832;
            box-shadow: 0 0 15px rgba(255, 200, 50, 0.3);
            animation: glowPulse 2s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% {
                box-shadow: 0 0 15px rgba(255, 200, 50, 0.3);
                border-left-color: #ffc832;
            }
            50% {
                box-shadow: 0 0 25px rgba(255, 200, 50, 0.5);
                border-left-color: #ffe066;
            }
        }

        .section-item.completed {
            background: rgba(0, 255, 136, 0.1);
            border-left-color: #00ff88;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-number {
            width: 28px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            font-size: 0.9rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .section-item.current .section-number {
            background: #ffc832;
            color: #1a1a2e;
        }

        .section-item.completed .section-number {
            background: #00ff88;
            color: #1a1a2e;
        }

        .section-title {
            font-weight: 500;
            font-size: 1rem;
            color: #eee;
        }

        .section-item.current .section-title {
            color: #fff;
            font-weight: 600;
        }

        .section-item.completed .section-title {
            color: #aaa;
        }

        .section-points {
            margin-top: 10px;
            margin-left: 40px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .section-points span {
            font-size: 0.85rem;
            color: #888;
            line-height: 1.4;
        }

        .section-item.current .section-points span {
            color: #ffe599;
        }

        .section-item.completed .section-points span {
            color: #777;
        }

        /* Section Keywords */
        .section-keywords {
            margin-top: 10px;
            margin-left: 40px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        .keywords-label {
            font-size: 0.75rem;
            color: #666;
            margin-right: 4px;
        }

        .keyword {
            display: inline-block;
            padding: 2px 8px;
            font-size: 0.75rem;
            background: rgba(100, 100, 120, 0.3);
            border-radius: 10px;
            color: #888;
            transition: all 0.3s ease;
        }

        .keyword.matched {
            background: rgba(0, 255, 136, 0.3);
            color: #00ff88;
            font-weight: 600;
        }

        .section-item.current .keyword {
            background: rgba(255, 200, 50, 0.2);
            color: #cca;
        }

        .section-item.current .keyword.matched {
            background: rgba(0, 255, 136, 0.4);
            color: #00ff88;
        }

        /* Keyword Progress Bar */
        .keyword-progress-bar {
            margin-top: 8px;
            margin-left: 40px;
            height: 4px;
            background: rgba(100, 100, 120, 0.3);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .keyword-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffa502, #ff6b6b);
            transition: width 0.5s ease;
            border-radius: 2px;
        }

        .keyword-progress-bar.good .keyword-progress-fill {
            background: linear-gradient(90deg, #ffc832, #2ed573);
        }

        .keyword-progress-bar.complete .keyword-progress-fill {
            background: linear-gradient(90deg, #00ff88, #00d4ff);
        }

        .keyword-progress-text {
            position: absolute;
            right: 0;
            top: -16px;
            font-size: 0.65rem;
            color: #666;
        }

        .section-item.completed .keyword-progress-bar {
            display: none;
        }

        /* Predicted keywords - distinct from section keywords */
        .section-predictions {
            margin-top: 8px;
            margin-left: 40px;
            padding: 6px 10px;
            background: rgba(138, 43, 226, 0.1);
            border-radius: 6px;
            border-left: 2px solid #8b5cf6;
        }

        .predictions-label {
            font-size: 0.7rem;
            color: #8b5cf6;
            text-transform: uppercase;
            margin-right: 8px;
        }

        .prediction-keyword {
            display: inline-block;
            padding: 2px 8px;
            margin: 2px 4px 2px 0;
            background: rgba(139, 92, 246, 0.2);
            border-radius: 12px;
            font-size: 0.75rem;
            color: #c4b5fd;
        }

        .prediction-keyword.cached {
            background: rgba(139, 92, 246, 0.4);
            color: #fff;
        }

        .prediction-keyword.hit {
            background: #22c55e;
            color: #fff;
            animation: hitFlash 0.5s ease;
        }

        @keyframes hitFlash {
            0% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .progress-bar {
            padding: 15px 20px;
            background: #16213e;
            border-top: 1px solid #333;
        }

        .progress-track {
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            width: 0%;
            transition: width 0.5s ease;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Script Outline</h1>
        <div class="status-indicator">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Connecting...</span>
        </div>
    </div>

    <div class="sections-container">
        <ul id="sections-list" class="sections-list">
            <li class="section-item loading">Waiting for script...</li>
        </ul>
    </div>

    <div class="progress-bar">
        <div class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div class="progress-info">
            <span id="section-info">Section 0</span>
            <span id="progress-percent">0%</span>
        </div>
    </div>

    <script src="/static/js/outline.js"></script>
</body>
</html>
